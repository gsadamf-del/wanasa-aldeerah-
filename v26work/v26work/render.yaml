services:
  - type: web
    name: wanasa-aldeerah-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v25/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_ACCESS_TOKEN
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.wanasa.aldeerah
      - key: APNS_PRODUCTION
        value: "true"
      - key: EXTERNAL_MONITORING_URL
        sync: false
      - key: EXTERNAL_MONITORING_API_KEY
        sync: false
      - key: RESTORE_DRILL_REQUIRED
        value: "true"
